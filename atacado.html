<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power PY — Área do Cliente</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#04060f;--surface:#0d1117;--border:rgba(59,130,246,0.12);
  --accent:#3b82f6;--accent2:#60a5fa;--text:#fff;--muted:rgba(255,255,255,0.35);
  --green:#22c55e;--red:#ef4444;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:var(--bg);}
.login-box{background:var(--surface);border:1px solid var(--border);padding:56px 48px;max-width:440px;width:100%;text-align:center;}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:6px;color:#fff;margin-bottom:4px;}
.login-logo span{color:var(--accent);}
.login-sub{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-bottom:48px;}
.login-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;display:block;text-align:left;margin-bottom:8px;}
.login-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#fff;padding:14px 18px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;margin-bottom:16px;}
.login-input:focus{border-color:var(--accent);}
.login-input::placeholder{color:rgba(255,255,255,0.2);}
.login-btn{width:100%;background:var(--accent);border:none;color:#fff;padding:16px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:4px;cursor:pointer;transition:background .2s;margin-top:8px;}
.login-btn:hover{background:#2563eb;}
.login-err{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--red);text-transform:uppercase;margin-bottom:12px;display:none;}
.login-attempts{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);margin-top:16px;letter-spacing:1px;}

/* ── MAIN ── */
#main-screen{display:none;}

/* NAV */
nav{position:sticky;top:0;z-index:100;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:rgba(4,6,15,0.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:4px;color:#fff;}
.nav-logo span{color:var(--accent);}
.nav-user{display:flex;align-items:center;gap:16px;}
.nav-greeting{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.nav-logout{background:none;border:1px solid rgba(255,255,255,0.1);color:var(--muted);padding:6px 16px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.nav-logout:hover{border-color:var(--red);color:var(--red);}

/* TICKER */
.ticker{background:rgba(34,197,94,0.08);border-bottom:1px solid rgba(34,197,94,0.15);padding:8px 40px;display:flex;align-items:center;gap:16px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:rgba(34,197,94,0.8);text-transform:uppercase;}
.ticker-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* BODY */
.container{max-width:1300px;margin:0 auto;padding:40px;}
.page-header{margin-bottom:40px;}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,6vw,72px);line-height:.9;color:#fff;margin-bottom:8px;}
.page-title span{color:var(--accent);}
.page-sub{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}

/* FILTER BAR */
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:32px;flex-wrap:wrap;}
.search-input{flex:1;min-width:220px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#fff;padding:12px 18px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--accent);}
.search-input::placeholder{color:rgba(255,255,255,0.2);}
.brand-pills{display:flex;flex-wrap:wrap;gap:8px;}
.pill{background:none;border:1px solid rgba(255,255,255,0.08);color:var(--muted);padding:8px 16px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;transition:all .2s;}
.pill.active,.pill:hover{border-color:var(--accent);color:var(--accent);}
.pill.all.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* PRODUCTS TABLE */
.brand-section{margin-bottom:48px;}
.brand-header{display:flex;align-items:center;gap:16px;padding:20px 0;border-bottom:2px solid var(--accent);margin-bottom:0;}
.brand-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:#fff;}
.brand-count{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.prod-table{width:100%;border-collapse:collapse;}
.prod-table thead th{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding:14px 16px;border-bottom:1px solid var(--border);text-align:left;}
.prod-table thead th:last-child{text-align:right;}
.prod-table tbody tr{border-bottom:1px solid rgba(255,255,255,0.03);transition:background .15s;}
.prod-table tbody tr:hover{background:rgba(59,130,246,0.04);}
.prod-table tbody tr.hidden{display:none;}
.td-name{padding:14px 16px;font-size:14px;color:rgba(255,255,255,0.85);}
.td-apresent{padding:14px 16px;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;}
.td-price{padding:14px 16px;text-align:right;}
.price-usd{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;letter-spacing:1px;line-height:1;}
.price-brl{font-size:11px;color:var(--green);font-family:'Space Mono',monospace;letter-spacing:1px;margin-top:2px;}
.confirm-badge{display:inline-block;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;color:#f59e0b;border:1px solid rgba(245,158,11,0.3);padding:2px 7px;margin-left:8px;vertical-align:middle;text-transform:uppercase;}
.td-wa{padding:14px 16px;text-align:right;}
.wa-btn{display:inline-flex;align-items:center;gap:6px;background:#25d366;color:#fff;border:none;padding:8px 18px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:all .2s;white-space:nowrap;}
.wa-btn:hover{background:#1fad55;transform:translateY(-1px);}

/* TIRZEPATIDAS SPECIAL */
.tirz-note{background:rgba(20,184,166,0.08);border:1px solid rgba(20,184,166,0.2);padding:12px 20px;margin-bottom:0;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:rgba(20,184,166,0.8);text-transform:uppercase;display:flex;align-items:center;gap:10px;}

/* NO RESULTS */
.no-results{text-align:center;padding:80px 20px;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}

/* CART FAB */
.cart-fab{position:fixed;bottom:80px;right:32px;z-index:500;}
.cart-fab-btn{width:56px;height:56px;background:var(--accent);border:none;border-radius:50%;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(59,130,246,0.4);transition:all .2s;position:relative;}
.cart-fab-btn:hover{transform:scale(1.08);background:#2563eb;}
.cart-count{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;}

/* CART SIDEBAR */
.cart-sidebar{position:fixed;top:0;right:-420px;width:420px;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:1000;transition:right .35s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;}
.cart-sidebar.open{right:0;}
.cart-top{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.cart-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:#fff;}
.cart-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;transition:color .2s;}
.cart-close:hover{color:#fff;}
.cart-items{flex:1;overflow-y:auto;padding:16px 24px;}
.cart-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.cart-item-info{flex:1;}
.cart-item-name{font-size:13px;color:rgba(255,255,255,0.85);margin-bottom:2px;}
.cart-item-brand{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.cart-item-price{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;white-space:nowrap;}
.cart-item-brl{font-family:'Space Mono',monospace;font-size:9px;color:var(--green);letter-spacing:1px;}
.cart-qty{display:flex;align-items:center;gap:8px;}
.qty-btn{background:rgba(255,255,255,0.06);border:none;color:#fff;width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.qty-btn:hover{background:rgba(59,130,246,0.2);}
.qty-val{font-family:'Space Mono',monospace;font-size:12px;color:#fff;min-width:20px;text-align:center;}
.remove-btn{background:none;border:none;color:rgba(255,255,255,0.2);cursor:pointer;font-size:14px;padding:4px;transition:color .2s;}
.remove-btn:hover{color:var(--red);}
.cart-empty{text-align:center;padding:60px 20px;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.cart-footer{padding:20px 24px;border-top:1px solid var(--border);flex-shrink:0;}
.cart-total-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;}
.cart-total-label{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.cart-total-usd{font-family:'Bebas Neue',sans-serif;font-size:36px;color:#fff;line-height:1;}
.cart-total-brl{font-family:'Space Mono',monospace;font-size:11px;color:var(--green);letter-spacing:1px;}
.cart-wa-btn{width:100%;background:#25d366;border:none;color:#fff;padding:16px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s;}
.cart-wa-btn:hover{background:#1fad55;}
.cart-wa-btn svg{flex-shrink:0;}

/* OVERLAY */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:none;}
.sidebar-overlay.open{display:block;}

/* TOAST */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 24px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;z-index:9999;opacity:0;transition:all .3s cubic-bezier(.16,1,.3,1);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* SCROLL FAB bottom marquee space */
body{padding-bottom:0;}

@media(max-width:768px){
  nav{padding:0 20px;}
  .container{padding:24px 16px;}
  .filter-bar{gap:8px;}
  .cart-sidebar{width:100%;right:-100%;}
  .td-apresent{display:none;}
  nav .nav-greeting{display:none;}
  .ticker{padding:8px 20px;font-size:9px;}
}

/* ══ MERCADO PAGO CHECKOUT ══ */
.cart-pay-btns{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.cart-pix-btn{width:100%;background:#00c2ff;border:none;color:#fff;padding:14px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s;}
.cart-pix-btn:hover{background:#00a8db;}
.cart-card-btn{width:100%;background:#6c63ff;border:none;color:#fff;padding:14px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s;}
.cart-card-btn:hover{background:#5a52e0;}
.cart-divider{text-align:center;font-family:'Space Mono',monospace;font-size:9px;color:rgba(255,255,255,0.2);letter-spacing:3px;text-transform:uppercase;margin:4px 0;}

/* CHECKOUT MODAL */
.checkout-modal{position:fixed;inset:0;z-index:2000;background:rgba(4,6,15,0.95);display:none;align-items:center;justify-content:center;padding:20px;}
.checkout-modal.open{display:flex;}
.checkout-box{background:#0d1117;border:1px solid rgba(59,130,246,0.2);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;}
.checkout-header{padding:24px 28px 16px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#0d1117;z-index:1;}
.checkout-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:#fff;}
.checkout-close{background:none;border:none;color:rgba(255,255,255,0.3);font-size:20px;cursor:pointer;transition:color .2s;}
.checkout-close:hover{color:#fff;}
.checkout-body{padding:24px 28px;}
.co-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,0.3);text-transform:uppercase;display:block;margin-bottom:6px;margin-top:16px;}
.co-label:first-child{margin-top:0;}
.co-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#fff;padding:12px 14px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;}
.co-input:focus{border-color:rgba(59,130,246,0.5);}
.co-input::placeholder{color:rgba(255,255,255,0.2);}
.co-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.co-total{background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.15);padding:16px;margin-top:20px;margin-bottom:4px;}
.co-total-label{font-family:'Space Mono',monospace;font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
.co-total-val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:#fff;line-height:1;}
.co-total-brl{font-family:'Space Mono',monospace;font-size:11px;color:#22c55e;letter-spacing:1px;margin-top:2px;}
.co-submit{width:100%;border:none;color:#fff;padding:16px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:4px;cursor:pointer;margin-top:16px;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:10px;}
.co-submit:disabled{opacity:.5;cursor:not-allowed;}
.co-submit.pix{background:#00c2ff;}
.co-submit.pix:hover:not(:disabled){background:#00a8db;}
.co-submit.card{background:#6c63ff;}
.co-submit.card:hover:not(:disabled){background:#5a52e0;}

/* PIX QR */
.pix-result{text-align:center;padding:8px 0;}
.pix-qr{width:200px;height:200px;margin:0 auto 16px;border:4px solid #fff;}
.pix-copy{width:100%;background:rgba(0,194,255,0.1);border:1px solid rgba(0,194,255,0.3);color:#00c2ff;padding:12px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;cursor:pointer;transition:all .2s;word-break:break-all;text-align:left;}
.pix-copy:hover{background:rgba(0,194,255,0.2);}
.pix-note{font-family:'Space Mono',monospace;font-size:9px;color:rgba(255,255,255,0.25);letter-spacing:1px;text-transform:uppercase;margin-top:12px;}
.co-spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.co-err{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#ef4444;padding:12px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;margin-top:12px;display:none;}

</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">POWER<span>PY</span></div>
    <div class="login-sub">Área do Cliente — Acesso Restrito</div>
    <label class="login-label">Login</label>
    <input class="login-input" id="login-user" type="text" placeholder="Seu login" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('login-pwd').focus()">
    <label class="login-label">Senha</label>
    <input class="login-input" id="login-pwd" type="password" placeholder="Sua senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="login-err" id="login-err">Login ou senha incorretos</div>
    <button class="login-btn" onclick="doLogin()">ENTRAR</button>
    <div class="login-attempts" id="login-attempts"></div>
  </div>
</div>

<!-- ── MAIN ── -->
<div id="main-screen">
  <nav>
    <div class="nav-logo">POWER<span>PY</span></div>
    <div class="nav-user">
      <span class="nav-greeting" id="nav-greeting"></span>
      <button class="nav-logout" onclick="doLogout()">Sair</button>
    </div>
  </nav>

  <div class="ticker">
    <div class="ticker-dot"></div>
    <span>Preços Atacado · Exclusivo</span>
    <span style="margin-left:auto;">USD/BRL: <strong id="ticker-rate">R$ 5,30</strong></span>
  </div>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">TABELA DE<br><span>ATACADO</span></h1>
      <div class="page-sub" id="page-sub">Produtos disponíveis · Preços exclusivos</div>
    </div>

    <!-- FILTER -->
    <div class="filter-bar">
      <input type="text" class="search-input" id="search" placeholder="Buscar produto..." oninput="filterAll()">
      <div class="brand-pills" id="brand-pills"></div>
    </div>

    <!-- PRODUCTS -->
    <div id="products-container"></div>
    <div class="no-results" id="no-results" style="display:none;">Nenhum produto encontrado</div>
  </div>
</div>

<!-- CART FAB -->
<div class="cart-fab">
  <button class="cart-fab-btn" onclick="toggleCart()">
    🛒
    <div class="cart-count" id="cart-count" style="display:none;">0</div>
  </button>
</div>

<!-- CART SIDEBAR -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cart-sidebar">
  <div class="cart-top">
    <div class="cart-title">Pedido</div>
    <button class="cart-close" onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-items" id="cart-items">
    <div class="cart-empty">Carrinho vazio</div>
  </div>
  <div class="cart-footer">
    <div class="cart-total-row">
      <div>
        <div class="cart-total-label">Total do Pedido</div>
        <div class="cart-total-usd" id="cart-total-usd">$0,00</div>
        <div class="cart-total-brl" id="cart-total-brl">≈ R$ 0,00</div>
      </div>
    </div>
    <div class="cart-pay-btns">
      <button class="cart-pix-btn" onclick="openCheckout('pix')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm0 4.5a7.5 7.5 0 110 15 7.5 7.5 0 010-15zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z"/></svg>
        PAGAR COM PIX
      </button>
      <button class="cart-card-btn" onclick="openCheckout('card')">
        💳 PAGAR COM CARTÃO
      </button>
    </div>

// AUTH
// ══════════════════════════════════════════════════════════════
let currentUser = null;
let failedAttempts = parseInt(sessionStorage.getItem('pp_fails')||'0');
const MAX_ATTEMPTS = 5;
const LOCK_MINUTES = 15;

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function doLogin(){
  // Check lockout
  const lockUntil = parseInt(sessionStorage.getItem('pp_lock')||'0');
  if(Date.now() < lockUntil){
    const mins = Math.ceil((lockUntil - Date.now())/60000);
    showErr(`Bloqueado por ${mins} min. Tente novamente mais tarde.`);
    return;
  }

  const user = document.getElementById('login-user').value.trim().toLowerCase();
  const pwd = document.getElementById('login-pwd').value;
  if(!user || !pwd){ showErr('Preencha login e senha'); return; }

  const hash = await sha256(`${user}:${pwd}`);

  if(CLIENTS[hash]){
    // SUCCESS
    sessionStorage.removeItem('pp_fails');
    sessionStorage.removeItem('pp_lock');
    sessionStorage.setItem('pp_session', JSON.stringify({hash, ts: Date.now()}));
    currentUser = CLIENTS[hash];
    showMain();
  } else {
    // FAIL
    failedAttempts++;
    sessionStorage.setItem('pp_fails', failedAttempts);
    if(failedAttempts >= MAX_ATTEMPTS){
      const lockUntil = Date.now() + LOCK_MINUTES * 60 * 1000;
      sessionStorage.setItem('pp_lock', lockUntil);
      showErr(`Muitas tentativas. Bloqueado por ${LOCK_MINUTES} minutos.`);
    } else {
      const left = MAX_ATTEMPTS - failedAttempts;
      showErr(`Login ou senha incorretos. ${left} tentativa(s) restante(s).`);
    }
    document.getElementById('login-pwd').value = '';
    document.getElementById('login-pwd').focus();
  }
}

function showErr(msg){
  const el = document.getElementById('login-err');
  el.textContent = msg;
  el.style.display = 'block';
}

function doLogout(){
  sessionStorage.removeItem('pp_session');
  currentUser = null;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pwd').value = '';
  document.getElementById('login-err').style.display = 'none';
}

function checkSession(){
  try{
    const s = JSON.parse(sessionStorage.getItem('pp_session')||'null');
    if(s && s.hash && CLIENTS[s.hash] && (Date.now()-s.ts) < 8*60*60*1000){
      currentUser = CLIENTS[s.hash];
      return true;
    }
  }catch(e){}
  return false;
}

    sec.querySelectorAll('tr.prod-row').forEach(row=>{
      const name = row.dataset.name.toLowerCase();
      const show = !q || name.includes(q);
      row.classList.toggle('hidden', !show);
      if(show) secVisible = true;
    });
    sec.style.display = secVisible ? '' : 'none';
    if(secVisible) anyVisible = true;
  });
  
  document.getElementById('no-results').style.display = anyVisible ? 'none' : 'block';
}

function brl(usd, brand_key){
  if(brand_key === 'tirzepatidas'){
    return TIRZ_BRL_FIXO.toFixed(0);
  }
  return (usd * USD_BRL).toFixed(2).replace('.',',');
}

function fmt(n){ return n.toFixed(2).replace('.',','); }

function renderProducts(){
  const cont = document.getElementById('products-container');
  let html = '';
  
  for(const [key, brand] of Object.entries(PRODUCTS)){
    const isTirz = key === 'tirzepatidas';
    html += `<div class="brand-section" data-brand="${key}">`;
    
    if(isTirz){
      html += `<div class="tirz-note">💊 Tirzepatidas · Valor em BRL fixo: R$ ${TIRZ_BRL_FIXO} por unidade (independente do câmbio)</div>`;
    }
    
    html += `<div class="brand-header">
      <div class="brand-dot" style="background:${brand.color}"></div>
      <div class="brand-name">${brand.label}</div>
      <div class="brand-count" style="margin-left:12px;">${brand.produtos.length} produtos</div>
    </div>
    <table class="prod-table">
      <thead><tr>
        <th>Produto</th>
        <th>Apresentação</th>
        <th style="text-align:right;">Atacado USD</th>
        <th style="text-align:right;">≈ BRL</th>
        <th></th>
      </tr></thead>
      <tbody>`;
    
    brand.produtos.forEach((p,i)=>{
      const brlVal = isTirz ? TIRZ_BRL_FIXO.toFixed(0) : fmt(p.atacado * USD_BRL);
      html += `<tr class="prod-row" data-name="${p.name.toLowerCase()}">
        <td class="td-name">${p.name}</td>
        <td class="td-apresent">${p.apresent||'—'}</td>
        <td class="td-price">
          <div class="price-usd">$${fmt(p.atacado)}</div>
        </td>
        <td class="td-price">
          <div class="price-usd" style="color:${brand.color};">R$${brlVal}</div>
        </td>
        <td class="td-wa">
          <button class="wa-btn" onclick="addToCart('${key}',${i})">+ Pedido</button>
        </td>
      </tr>`;
    });
    
    html += `</tbody></table></div>`;
  }
  
  cont.innerHTML = html;
}

// CART
// ══════════════════════════════════════════════════════════════
function addToCart(brandKey, idx){
  const brand = PRODUCTS[brandKey];
  const p = brand.produtos[idx];
  const isTirz = brandKey === 'tirzepatidas';
  
  const existing = cart.find(c=>c.brandKey===brandKey && c.idx===idx);
  if(existing){
    existing.qty++;
  } else {
    cart.push({ brandKey, idx, name: p.name, brand: brand.label, priceUSD: p.atacado, isTirz, qty: 1 });
  }
  renderCart();
  showToast(`${p.name} adicionado`);
}

function removeFromCart(i){
  cart.splice(i,1);
  renderCart();
}

function changeQty(i, delta){
  cart[i].qty = Math.max(1, cart[i].qty + delta);
  renderCart();
}

function toggleCart(){
  document.getElementById('cart-sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}

function renderCart(){
  const count = cart.reduce((a,c)=>a+c.qty,0);
  const countEl = document.getElementById('cart-count');
  countEl.textContent = count;
  countEl.style.display = count > 0 ? 'flex' : 'none';
  
  if(cart.length === 0){
    document.getElementById('cart-items').innerHTML = '<div class="cart-empty">Carrinho vazio</div>';
    document.getElementById('cart-total-usd').textContent = '$0,00';
    document.getElementById('cart-total-brl').textContent = '≈ R$ 0,00';
    return;
  }
  
  let totalUSD = 0;
  let totalBRL = 0;
  let html = '';
  
  cart.forEach((item, i) => {
    const lineUSD = item.priceUSD * item.qty;
    const lineBRL = item.isTirz ? TIRZ_BRL_FIXO * item.qty : lineUSD * USD_BRL;
    totalUSD += lineUSD;
    totalBRL += lineBRL;
    html += `<div class="cart-item">
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-brand">${item.brand}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
        <div>
          <div class="cart-item-price">$${fmt(lineUSD)}</div>
          <div class="cart-item-brl">≈ R$${item.isTirz ? (TIRZ_BRL_FIXO*item.qty).toFixed(0) : fmt(lineBRL)}</div>
        </div>
        <div class="cart-qty">
          <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
          <span class="qty-val">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
          <button class="remove-btn" onclick="removeFromCart(${i})">🗑</button>
        </div>
      </div>
    </div>`;
  });
  
  document.getElementById('cart-items').innerHTML = html;
  document.getElementById('cart-total-usd').textContent = `$${fmt(totalUSD)}`;
  document.getElementById('cart-total-brl').textContent = `≈ R$ ${fmt(totalBRL)}`;
}

function sendWhatsApp(){
  if(cart.length === 0){ showToast('Carrinho vazio'); return; }
  
  let msg = `*PEDIDO ATACADO — POWER PY*\n`;
  msg += `Cliente: ${currentUser.name}\n`;
  msg += `Câmbio: $1 = R$${USD_BRL.toFixed(2)}\n`;
  msg += `━━━━━━━━━━━━━━━━━━━━\n`;
  
  let totalUSD = 0, totalBRL = 0;
  cart.forEach(item=>{
    const lineUSD = item.priceUSD * item.qty;
    const lineBRL = item.isTirz ? TIRZ_BRL_FIXO * item.qty : lineUSD * USD_BRL;
    totalUSD += lineUSD;
    totalBRL += lineBRL;
    const brlStr = item.isTirz ? `R$${(TIRZ_BRL_FIXO*item.qty).toFixed(0)}` : `R$${fmt(lineBRL)}`;
    msg += `• ${item.name} (${item.brand})\n  ${item.qty}x $${fmt(item.priceUSD)} = $${fmt(lineUSD)} / ${brlStr}\n`;
  });
  
  msg += `━━━━━━━━━━━━━━━━━━━━\n`;
  msg += `*TOTAL: $${fmt(totalUSD)} / R$${fmt(totalBRL)}*\n`;
  
  window.open(`https://wa.me/${WA_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
  
  // Log lead to server
  fetch('/api/lead', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      tipo: 'pedido_atacado',
      nome: currentUser.name,
      produto: cart.map(c=>`${c.name} x${c.qty}`).join(', '),
      mensagem: `ATACADO · Total: $${fmt(totalUSD)} / R$${fmt(totalBRL)}`
    })
  }).catch(()=>{});
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2500);
}

// MERCADO PAGO
// ══════════════════════════════════════════════════════════════
let MP_PK = null;
let mpjs_loaded = false;
let checkoutMode = 'pix'; // 'pix' or 'card'

async function getMpPk(){
  if(MP_PK) return MP_PK;
  try{
    const r = await fetch('/api/mp/pubkey');
    if(r.ok){ const d = await r.json(); MP_PK = d.public_key; }
  }catch(e){}
  return MP_PK;
}

function calcTotalBRL(){
  return cart.reduce((sum, item) => {
    const lineBRL = item.isTirz ? TIRZ_BRL_FIXO * item.qty : item.priceUSD * item.qty * USD_BRL;
    return sum + lineBRL;
  }, 0);
}

function cartDescription(){
  return cart.map(c => `${c.name} x${c.qty}`).join(', ').slice(0, 200);
}

async function openCheckout(mode){
  if(cart.length === 0){ showToast('Carrinho vazio'); return; }
  checkoutMode = mode;
  const modal = document.getElementById('checkout-modal');
  const title = document.getElementById('co-title');
  const body  = document.getElementById('co-body');
  
  title.textContent = mode === 'pix' ? 'PAGAR COM PIX' : 'PAGAR COM CARTÃO';
  
  const totalBRL = calcTotalBRL();
  const totalFmt = totalBRL.toFixed(2).replace('.',',');
  
  const totalHTML = `
    <div class="co-total">
      <div class="co-total-label">Total a pagar</div>
      <div class="co-total-val">R$ ${totalFmt}</div>
      <div class="co-total-brl">${cartDescription()}</div>
    </div>`;
  
  if(mode === 'pix'){
    body.innerHTML = `
      <label class="co-label">Nome completo</label>
      <input class="co-input" id="co-nome" placeholder="Seu nome" value="${currentUser.name}">
      <label class="co-label">Sobrenome</label>
      <input class="co-input" id="co-sobrenome" placeholder="Seu sobrenome">
      <label class="co-label">CPF (somente números)</label>
      <input class="co-input" id="co-cpf" placeholder="12345678901" maxlength="11" oninput="this.value=this.value.replace(/\D/g,'')">
      <label class="co-label">E-mail</label>
      <input class="co-input" id="co-email" type="email" placeholder="seu@email.com">
      ${totalHTML}
      <div class="co-err" id="co-err"></div>
      <button class="co-submit pix" id="co-btn" onclick="submitPix()">
        GERAR PIX
      </button>`;
  } else {
    // Card — load MP SDK
    await getMpPk();
    body.innerHTML = `
      <label class="co-label">Nome (como no cartão)</label>
      <input class="co-input" id="co-nome" placeholder="NOME SOBRENOME">
      <label class="co-label">E-mail</label>
      <input class="co-input" id="co-email" type="email" placeholder="seu@email.com">
      <label class="co-label">CPF do titular</label>
      <input class="co-input" id="co-cpf" placeholder="12345678901" maxlength="11" oninput="this.value=this.value.replace(/\D/g,'')">
      <label class="co-label">Número do cartão</label>
      <input class="co-input" id="co-cardnum" placeholder="0000 0000 0000 0000" maxlength="19" oninput="fmtCard(this)">
      <div class="co-row">
        <div>
          <label class="co-label">Validade</label>
          <input class="co-input" id="co-expiry" placeholder="MM/AA" maxlength="5" oninput="fmtExpiry(this)">
        </div>
        <div>
          <label class="co-label">CVV</label>
          <input class="co-input" id="co-cvv" placeholder="123" maxlength="4" oninput="this.value=this.value.replace(/\D/g,'')">
        </div>
      </div>
      <label class="co-label">Parcelas</label>
      <select class="co-input" id="co-parcelas" style="background:#0d1117;">
        <option value="1">1x de R$ ${(totalBRL).toFixed(2).replace('.',',')} sem juros</option>
        <option value="2">2x de R$ ${(totalBRL/2).toFixed(2).replace('.',',')} sem juros</option>
        <option value="3">3x de R$ ${(totalBRL/3).toFixed(2).replace('.',',')} sem juros</option>
      </select>
      ${totalHTML}
      <div class="co-err" id="co-err"></div>
      <button class="co-submit card" id="co-btn" onclick="submitCard()">
        💳 PAGAR R$ ${totalFmt}
      </button>`;
  }
  
  modal.classList.add('open');
}

function closeCheckout(){
  document.getElementById('checkout-modal').classList.remove('open');
}

// Format card number with spaces
function fmtCard(el){
  let v = el.value.replace(/\D/g,'').slice(0,16);
  el.value = v.replace(/(\d{4})/g,'$1 ').trim();
}
function fmtExpiry(el){
  let v = el.value.replace(/\D/g,'');
  if(v.length >= 2) v = v.slice(0,2)+'/'+v.slice(2,4);
  el.value = v;
}

function coErr(msg){
  const el = document.getElementById('co-err');
  el.textContent = msg;
  el.style.display = 'block';
}

function setLoading(loading){
  const btn = document.getElementById('co-btn');
  if(!btn) return;
  if(loading){
    btn.disabled = true;
    btn.innerHTML = '<div class="co-spinner"></div> PROCESSANDO...';
  } else {
    btn.disabled = false;
    btn.innerHTML = checkoutMode === 'pix' ? 'GERAR PIX' : '💳 PAGAR';
  }
}

async function submitPix(){
  const nome  = document.getElementById('co-nome').value.trim();
  const sobre = document.getElementById('co-sobrenome').value.trim();
  const cpf   = document.getElementById('co-cpf').value.replace(/\D/g,'');
  const email = document.getElementById('co-email').value.trim();
  
  if(!nome){ coErr('Preencha o nome'); return; }
  if(cpf.length !== 11){ coErr('CPF inválido — 11 dígitos'); return; }
  if(!email.includes('@')){ coErr('E-mail inválido'); return; }
  
  const totalBRL = calcTotalBRL();
  setLoading(true);
  
  try{
    const r = await fetch('/api/mp/pix', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        amount: totalBRL,
        description: cartDescription(),
        nome, sobrenome: sobre || 'PowerPY',
        cpf, email
      })
    });
    const data = await r.json();
    if(!r.ok || data.error){
      coErr(data.error || data.message || 'Erro ao gerar PIX');
      setLoading(false);
      return;
    }
    // Show QR code
    const qr   = data.point_of_interaction?.transaction_data?.qr_code;
    const qrB64 = data.point_of_interaction?.transaction_data?.qr_code_base64;
    const payId  = data.id;
    
    document.getElementById('co-body').innerHTML = `
      <div class="pix-result">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:#00c2ff;letter-spacing:3px;margin-bottom:16px;">PIX GERADO!</div>
        ${qrB64 ? `<img class="pix-qr" src="data:image/png;base64,${qrB64}" alt="QR PIX">` : ''}
        <div style="font-family:'Space Mono',monospace;font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;">Ou copie o código PIX:</div>
        <button class="pix-copy" onclick="copyPix('${qr}')">📋 ${qr ? qr.slice(0,60)+'...' : 'Copiar'}</button>
        <div class="pix-note">⏳ Válido por 30 minutos · ID: ${payId}</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;margin-top:20px;">R$ ${totalBRL.toFixed(2).replace('.',',')}</div>
        <button onclick="closeCheckout()" style="margin-top:20px;width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);padding:12px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;">Fechar</button>
      </div>`;
    
    // Log lead
    logLead('PIX', totalBRL, payId);
  }catch(e){
    coErr('Erro de conexão. Tente novamente.');
    setLoading(false);
  }
}

function copyPix(code){
  navigator.clipboard.writeText(code).then(()=>showToast('Código PIX copiado!')).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Código PIX copiado!');
  });
}

async function submitCard(){
  const nome    = document.getElementById('co-nome').value.trim();
  const email   = document.getElementById('co-email').value.trim();
  const cpf     = document.getElementById('co-cpf').value.replace(/\D/g,'');
  const cardnum = document.getElementById('co-cardnum').value.replace(/\s/g,'');
  const expiry  = document.getElementById('co-expiry').value;
  const cvv     = document.getElementById('co-cvv').value;
  const parcelas = parseInt(document.getElementById('co-parcelas').value)||1;
  
  if(!nome){ coErr('Preencha o nome'); return; }
  if(!email.includes('@')){ coErr('E-mail inválido'); return; }
  if(cpf.length !== 11){ coErr('CPF inválido'); return; }
  if(cardnum.length < 15){ coErr('Número do cartão inválido'); return; }
  if(!expiry.includes('/')){ coErr('Validade inválida (MM/AA)'); return; }
  if(cvv.length < 3){ coErr('CVV inválido'); return; }
  
  const [expMM, expYY] = expiry.split('/');
  const totalBRL = calcTotalBRL();
  
  setLoading(true);
  
  try{
    const pk = await getMpPk();
    if(!pk){ coErr('Erro ao carregar configuração de pagamento'); setLoading(false); return; }
    
    // Use MP SDK to tokenize card
    const mp = new MercadoPago(pk);
    const cardToken = await mp.createCardToken({
      cardNumber: cardnum,
      cardholderName: nome,
      cardExpirationMonth: expMM,
      cardExpirationYear: '20'+expYY,
      securityCode: cvv,
      identificationType: 'CPF',
      identificationNumber: cpf
    });
    
    // Get payment method
    const pmData = await mp.getPaymentMethods({ bin: cardnum.slice(0,6) });
    const paymentMethodId = pmData.results[0]?.id || 'visa';
    
    const r = await fetch('/api/mp/payment', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        token: cardToken.id,
        payment_method_id: paymentMethodId,
        installments: parcelas,
        amount: totalBRL,
        description: cartDescription(),
        nome, cpf, email
      })
    });
    
    const data = await r.json();
    
    if(data.status === 'approved'){
      document.getElementById('co-body').innerHTML = `
        <div class="pix-result">
          <div style="font-size:48px;margin-bottom:12px;">✅</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:#22c55e;letter-spacing:3px;margin-bottom:8px;">PAGAMENTO APROVADO!</div>
          <div style="font-family:'Space Mono',monospace;font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:1px;">ID: ${data.id} · R$ ${totalBRL.toFixed(2).replace('.',',')}</div>
          <button onclick="closeCheckout();cart=[];renderCart();" style="margin-top:24px;width:100%;background:#22c55e;border:none;color:#fff;padding:14px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;cursor:pointer;">FECHAR</button>
        </div>`;
      logLead('CARTÃO', totalBRL, data.id);
    } else if(data.status === 'in_process' || data.status === 'pending'){
      document.getElementById('co-body').innerHTML = `
        <div class="pix-result">
          <div style="font-size:48px;margin-bottom:12px;">⏳</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:#f59e0b;letter-spacing:3px;margin-bottom:8px;">EM ANÁLISE</div>
          <div style="font-family:'Space Mono',monospace;font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:1px;">Pagamento em processamento. ID: ${data.id}</div>
          <button onclick="closeCheckout()" style="margin-top:24px;width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:12px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;">Fechar</button>
        </div>`;
    } else {
      coErr(`Pagamento não aprovado: ${data.status_detail || data.status || 'Erro'}`);
      setLoading(false);
    }
  }catch(e){
    coErr('Erro ao processar cartão: ' + (e.message || 'Tente novamente'));
    setLoading(false);
  }
}

// Load MP SDK when needed
async function loadMpSdk(){
  if(window.MercadoPago) return;
  const pk = await getMpPk();
  if(!pk) return;
  return new Promise(resolve=>{
    const s = document.createElement('script');
    s.src = 'https://sdk.mercadopago.com/js/v2';
    s.onload = resolve;
    document.head.appendChild(s);
  });
}

function logLead(tipo, totalBRL, payId){
  fetch('/api/lead', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      tipo: 'pagamento_atacado',
      nome: currentUser.name,
      produto: cartDescription(),
      mensagem: `${tipo} · R$ ${totalBRL.toFixed(2)} · ID: ${payId}`
    })
  }).catch(()=>{});
}

// Load SDK on page ready
loadMpSdk();

// Close modal on ESC
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeCheckout(); });
